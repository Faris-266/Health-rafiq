<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق · Rafiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100%}
.hero{background:var(--topbar);color:var(--on-topbar);padding:48px clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hero .mark{font:600 clamp(64px,11vw,128px)/1 var(--display);margin:0 0 8px}
.hero p{max-width:30ch;font-size:17px;opacity:.88;margin:0 0 28px}
.tags{display:flex;gap:10px}
.tags i{width:46px;height:64px;border-radius:6px;background:var(--c);position:relative;display:block;opacity:.95}
.tags i::after{content:"";position:absolute;inset-block-start:7px;inset-inline-start:50%;margin-inline-start:-4px;width:8px;height:8px;border-radius:50%;background:var(--topbar);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.formside{display:flex;flex-direction:column;padding:20px clamp(20px,5vw,64px)}
.tools{display:flex;gap:8px;justify-content:flex-end}
.formwrap{margin:auto 0;width:100%;max-width:380px;align-self:center}
h1{font:600 26px var(--display);margin:0 0 4px} .sub{color:var(--muted);margin:0 0 22px}
.pwrow{position:relative}
.pwrow button{position:absolute;inset-block:0;inset-inline-end:4px;border:0;background:none;color:var(--muted);padding:0 8px}
.demo{margin-top:22px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.demo b{font-family:var(--display)} .demo button{border:0;background:none;color:var(--petrol);text-decoration:underline;padding:2px 4px}
.warn{color:var(--amber-ink);margin-top:6px}
@media (max-width:820px){body{grid-template-columns:1fr}.hero{padding:28px 24px}.hero .mark{font-size:64px}.hero p{display:none}.tags{display:none}}
</style>
</head>
<body>
<section class="hero" aria-hidden="true">
  <div class="mark">رفيق</div>
  <p id="tag"></p>
  <div class="tags"><i style="--c:var(--red)"></i><i style="--c:var(--amber)"></i><i style="--c:var(--green)"></i></div>
</section>
<main class="formside">
  <div class="tools"><button class="icon-btn" id="theme" type="button"></button><button class="btn" id="lang" type="button"></button></div>
  <div class="formwrap">
    <h1 id="h"></h1><p class="sub" id="sub"></p>
    <form id="f" autocomplete="on">
      <label class="field"><span id="l-u"></span><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required dir="ltr"></label>
      <label class="field"><span id="l-p"></span><div class="pwrow"><input id="p" name="password" type="password" autocomplete="current-password" required dir="ltr"><button type="button" id="show"></button></div></label>
      <div class="err" id="e" role="alert"></div>
      <button class="btn primary" id="go" style="width:100%;padding:10px"></button>
    </form>
    <p class="note" style="margin-top:12px;text-align:center"><a href="#" id="forgot"></a></p>
    <p class="note" id="reg" style="margin-top:8px;text-align:center"></p>
    <p class="note" id="orgline" style="margin-top:14px;text-align:center"></p>
    <div class="demo hidden" id="demo"></div>
  </div>
</main>
<script>
const R = window.RAFIQ, $ = (i) => document.getElementById(i);
const L = {
  ar: { tag: "متابعة السكري وضغط الدم كل يوم: من المريض إلى الطبيب، قبل أن تتفاقم المشكلة.", tags: { chronic: "متابعة السكري وضغط الدم كل يوم: من المريض إلى الطبيب، قبل أن تتفاقم المشكلة.", breast: "الكشف المبكر عن سرطان الثدي: وعي وفحص ومتابعة حتى تُفحص كل امرأة.", both: "رعاية متكاملة: متابعة الأمراض المزمنة والكشف المبكر عن سرطان الثدي." }, h: "تسجيل الدخول", sub: "للأطباء ومدراء النظام والمستخدمات المسجلات.", forgot: "نسيت كلمة المرور؟", ft: "استعادة كلمة المرور", fsub: "اكتب بريدك أو رقم هاتفك المسجّل وسنرسل لك رمزًا.", fsend: "إرسال الرمز", fcode: "الرمز (6 أرقام)", fnew: "كلمة المرور الجديدة (٨ أحرف على الأقل)", freset: "تغيير كلمة المرور", fsent: "إن كان الحساب موجودًا فقد أرسلنا رمزًا.", funav: "استعادة كلمة المرور بالرمز غير مفعّلة هنا. اطلب من مدير النظام أو العيادة إعادة تعيينها.", fdone: "تم تغيير كلمة المرور. يمكنك تسجيل الدخول الآن.", fcancel: "إغلاق", noacct: "ليس لديك حساب؟", create: "إنشاء حساب", u: "البريد الإلكتروني أو الهاتف أو اسم المستخدم", p: "كلمة المرور", go: "دخول", show: "إظهار", hide: "إخفاء", fail: "تعذّر تسجيل الدخول",
        demo: "وضع تجريبي · كلمة المرور للجميع:", warn: "بيانات وهمية فقط. لا تستخدم هذا الوضع مع مرضى حقيقيين.", roles: { admin: "مدير", clinician: "طبيب", patient: "مريض" }, officialOf: "خدمة رسمية من", runBy: "تُشغَّلها", demoOrg: "نسخة تجريبية ببيانات وهمية، وليست خدمة رسمية" },
  en: { tag: "Daily diabetes and blood-pressure monitoring, from patient to doctor, before problems escalate.", tags: { chronic: "Daily diabetes and blood-pressure monitoring, from patient to doctor, before problems escalate.", breast: "Early breast-cancer detection: awareness, screening, and follow-through until every woman is seen.", both: "Joined-up care: chronic-disease monitoring and early breast-cancer detection." }, h: "Sign in", sub: "For clinicians, administrators and registered users.", forgot: "Forgot password?", ft: "Reset your password", fsub: "Enter your registered email or phone and we'll send you a code.", fsend: "Send code", fcode: "Code (6 digits)", fnew: "New password (min 8 characters)", freset: "Change password", fsent: "If that account exists, we've sent a code.", funav: "Resetting by code isn't enabled here. Ask your administrator or clinic to reset your password.", fdone: "Password changed. You can sign in now.", fcancel: "Close", noacct: "New here?", create: "Create an account", u: "Email, phone or username", p: "Password", go: "Sign in", show: "Show", hide: "Hide", fail: "Sign-in failed",
        demo: "Demo mode · password for all accounts:", warn: "Synthetic data only. Never run demo mode with real patients.", roles: { admin: "Admin", clinician: "Clinician", patient: "Patient" }, officialOf: "Official service of", runBy: "Operated by", demoOrg: "Demonstration system with fictional data; not an official service" },
};
let pub = null;
function paint() {
  const t = L[R.lang];
  $("tag").textContent = (pub && t.tags[pub.programme]) || t.tag; $("h").textContent = t.h; $("sub").textContent = t.sub; $("l-u").textContent = t.u; $("l-p").textContent = t.p; $("go").textContent = t.go; $("forgot").textContent = t.forgot;
  $("reg").innerHTML = `${t.noacct} <a href="/register">${t.create}</a>`;
  $("show").textContent = $("p").type === "password" ? t.show : t.hide;
  if (pub && pub.org) {
    const o = pub.org, extra = [o.phone, o.url].filter(Boolean).join(" · ");
    $("orgline").textContent = o.demo ? t.demoOrg : `${o.official ? t.officialOf : t.runBy} ${o.name}${extra ? " · " + extra : ""}`;
  }
  if (pub && pub.demo) {
    const d = $("demo"); d.classList.remove("hidden");
    d.innerHTML = `<b>${t.demo}</b> <code dir="ltr">${R.esc(pub.password)}</code><div style="margin-top:6px">` +
      pub.accounts.map((a) => `<button type="button" data-u="${R.esc(a.username)}">${R.esc(a.username)}</button> <span class="note">${t.roles[a.role]}</span>`).join(" · ") + `</div><div class="warn">${t.warn}</div>`;
  }
}
R.chrome({ onLang: paint });
$("forgot").onclick = (e) => {
  e.preventDefault(); const t = L[R.lang], d = document.createElement("dialog");
  d.innerHTML = `<form id="ff"><h3>${t.ft}</h3><p class="note">${t.fsub}</p>
    <label class="field"><span>${t.u}</span><input id="f-id" dir="ltr" autocomplete="username" required></label>
    <div id="f-2" class="hidden"><label class="field"><span>${t.fcode}</span><input id="f-code" inputmode="numeric" maxlength="6" dir="ltr" autocomplete="one-time-code"></label>
    <label class="field"><span>${t.fnew}</span><input id="f-pw" type="password" dir="ltr" autocomplete="new-password"></label></div>
    <div class="err" id="f-e"></div><div class="note" id="f-m"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="f-x">${t.fcancel}</button><button class="btn primary" id="f-go">${t.fsend}</button></div></form>`;
  document.body.appendChild(d); d.showModal();
  let step = 1; const q = (s) => d.querySelector(s);
  q("#f-x").onclick = () => { d.close(); d.remove(); };
  q("#ff").onsubmit = async (ev) => {
    ev.preventDefault(); q("#f-e").textContent = ""; q("#f-m").textContent = "";
    const post = async (url, body) => { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(Array.isArray(j.detail) ? j.detail.map((x) => x.msg).join("; ") : j.detail || "Error"); return j; };
    try {
      if (step === 1) {
        const j = await post("/api/auth/forgot", { identifier: q("#f-id").value });
        if (j.status === "unavailable") { q("#f-m").textContent = t.funav; return; }
        q("#f-m").textContent = t.fsent; q("#f-2").classList.remove("hidden"); q("#f-go").textContent = t.freset; step = 2; q("#f-code").focus();
      } else {
        if (q("#f-pw").value.length < 8) { q("#f-e").textContent = t.fnew; return; }
        await post("/api/auth/reset", { identifier: q("#f-id").value, code: q("#f-code").value.trim(), new_password: q("#f-pw").value });
        q("#f-m").textContent = t.fdone; q("#f-go").classList.add("hidden");
      }
    } catch (err) { q("#f-e").textContent = err.message; }
  };
};
$("show").onclick = () => { $("p").type = $("p").type === "password" ? "text" : "password"; paint(); };
document.addEventListener("click", (e) => { const b = e.target.closest("[data-u]"); if (b) { $("u").value = b.dataset.u; $("p").value = pub.password; $("f").requestSubmit(); } });
$("f").onsubmit = async (e) => {
  e.preventDefault(); $("e").textContent = ""; $("go").disabled = true;
  try {
    const r = await fetch("/api/auth/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403 && j.detail === "verification_required") { location.href = "/register?verify=" + encodeURIComponent($("u").value); return; }
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : L[R.lang].fail);
    if (j.must_change) await R.passwordDialog(true);     // temporary password: change it right here, before anything else
    location.href = j.redirect;
  } catch (err) { $("e").textContent = err.message; $("p").value = ""; $("p").focus(); }
  finally { $("go").disabled = false; }
};
fetch("/api/auth/public").then((r) => r.json()).then((j) => { pub = j; paint(); }).catch(() => {});
paint(); $("u").focus();
</script>
</body>
</html>
