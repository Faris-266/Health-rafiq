<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق · Rafiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100%}
.hero{background:var(--topbar);color:var(--on-topbar);padding:48px clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hero .mark{font:600 clamp(64px,11vw,128px)/1 var(--display);margin:0 0 8px}
.hero p{max-width:30ch;font-size:17px;opacity:.88;margin:0 0 28px}
.tags{display:flex;gap:10px}
.tags i{width:46px;height:64px;border-radius:6px;background:var(--c);position:relative;display:block;opacity:.95}
.tags i::after{content:"";position:absolute;inset-block-start:7px;inset-inline-start:50%;margin-inline-start:-4px;width:8px;height:8px;border-radius:50%;background:var(--topbar);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.formside{display:flex;flex-direction:column;padding:20px clamp(20px,5vw,64px)}
.tools{display:flex;gap:8px;justify-content:flex-end}
.formwrap{margin:auto 0;width:100%;max-width:380px;align-self:center}
h1{font:600 26px var(--display);margin:0 0 4px} .sub{color:var(--muted);margin:0 0 22px}
.pwrow{position:relative}
.pwrow button{position:absolute;inset-block:0;inset-inline-end:4px;border:0;background:none;color:var(--muted);padding:0 8px}
.demo{margin-top:22px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.demo b{font-family:var(--display)} .demo button{border:0;background:none;color:var(--petrol);text-decoration:underline;padding:2px 4px}
.warn{color:var(--amber-ink);margin-top:6px}
@media (max-width:820px){body{grid-template-columns:1fr}.hero{padding:28px 24px}.hero .mark{font-size:64px}.hero p{display:none}.tags{display:none}}
</style>
</head>
<body>
<section class="hero" aria-hidden="true">
  <div class="mark">رفيق</div>
  <p id="tag"></p>
  <div class="tags"><i style="--c:var(--red)"></i><i style="--c:var(--amber)"></i><i style="--c:var(--green)"></i></div>
</section>
<main class="formside">
  <div class="tools"><button class="icon-btn" id="theme" type="button"></button><button class="btn" id="lang" type="button"></button></div>
  <div class="formwrap">
    <h1 id="h"></h1><p class="sub" id="sub"></p>
    <form id="f" autocomplete="on">
      <label class="field"><span id="l-u"></span><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required dir="ltr"></label>
      <label class="field"><span id="l-p"></span><div class="pwrow"><input id="p" name="password" type="password" autocomplete="current-password" required dir="ltr"><button type="button" id="show"></button></div></label>
      <div class="err" id="e" role="alert"></div>
      <button class="btn primary" id="go" style="width:100%;padding:10px"></button>
    </form>
    <p class="note" id="reg" style="margin-top:14px;text-align:center"></p>
    <div class="demo hidden" id="demo"></div>
  </div>
</main>
<script>
const R = window.RAFIQ, $ = (i) => document.getElementById(i);
const L = {
  ar: { tag: "الكشف المبكر عن سرطان الثدي: وعي وفحص ومتابعة حتى تُفحص كل امرأة.", h: "تسجيل الدخول", sub: "للأطباء ومدراء النظام والمستخدمات المسجلات.", noacct: "ليس لديك حساب؟", create: "إنشاء حساب", u: "البريد الإلكتروني أو الهاتف أو اسم المستخدم", p: "كلمة المرور", go: "دخول", show: "إظهار", hide: "إخفاء", fail: "تعذّر تسجيل الدخول",
        demo: "وضع تجريبي · كلمة المرور للجميع:", warn: "بيانات وهمية فقط. لا تستخدم هذا الوضع مع مرضى حقيقيين.", roles: { admin: "مدير", clinician: "طبيب", patient: "مريض" } },
  en: { tag: "Early breast-cancer detection: awareness, screening, and follow-through until every woman is seen.", h: "Sign in", sub: "For clinicians, administrators and registered users.", noacct: "New here?", create: "Create an account", u: "Email, phone or username", p: "Password", go: "Sign in", show: "Show", hide: "Hide", fail: "Sign-in failed",
        demo: "Demo mode · password for all accounts:", warn: "Synthetic data only. Never run demo mode with real patients.", roles: { admin: "Admin", clinician: "Clinician", patient: "Patient" } },
};
let pub = null;
function paint() {
  const t = L[R.lang];
  $("tag").textContent = t.tag; $("h").textContent = t.h; $("sub").textContent = t.sub; $("l-u").textContent = t.u; $("l-p").textContent = t.p; $("go").textContent = t.go;
  $("reg").innerHTML = `${t.noacct} <a href="/register">${t.create}</a>`;
  $("show").textContent = $("p").type === "password" ? t.show : t.hide;
  if (pub && pub.demo) {
    const d = $("demo"); d.classList.remove("hidden");
    d.innerHTML = `<b>${t.demo}</b> <code dir="ltr">${R.esc(pub.password)}</code><div style="margin-top:6px">` +
      pub.accounts.map((a) => `<button type="button" data-u="${R.esc(a.username)}">${R.esc(a.username)}</button> <span class="note">${t.roles[a.role]}</span>`).join(" · ") + `</div><div class="warn">${t.warn}</div>`;
  }
}
R.chrome({ onLang: paint });
$("show").onclick = () => { $("p").type = $("p").type === "password" ? "text" : "password"; paint(); };
document.addEventListener("click", (e) => { const b = e.target.closest("[data-u]"); if (b) { $("u").value = b.dataset.u; $("p").value = pub.password; $("f").requestSubmit(); } });
$("f").onsubmit = async (e) => {
  e.preventDefault(); $("e").textContent = ""; $("go").disabled = true;
  try {
    const r = await fetch("/api/auth/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403 && j.detail === "verification_required") { location.href = "/register?verify=" + encodeURIComponent($("u").value); return; }
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : L[R.lang].fail);
    location.href = j.redirect;
  } catch (err) { $("e").textContent = err.message; $("p").value = ""; $("p").focus(); }
  finally { $("go").disabled = false; }
};
fetch("/api/auth/public").then((r) => r.json()).then((j) => { pub = j; paint(); }).catch(() => {});
paint(); $("u").focus();
</script>
</body>
</html>
