<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق · Rafiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
body{display:flex;flex-direction:column}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;min-width:64px}
.kpi b{font:500 22px/1.1 var(--display)}
.kpi small{opacity:.8;font-size:11.5px}
.kpi.urgent b{color:#FFB3BB}
.chan{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.topbar a.btn{text-decoration:none;color:inherit}
main{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(300px,360px);gap:14px;padding:14px 20px 20px;flex:1;min-height:0}
@media (max-width:1180px){main{grid-template-columns:1fr;flex:none}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.col>h2{margin:0;padding:12px 14px;font:500 15px var(--display);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.col>h2 .sp{margin-inline-start:auto}
.scroll{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}

.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--petrol);font-weight:600}

/* triage tag */
.tag{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;padding-inline-start:30px;box-shadow:var(--shadow);cursor:pointer}
.tag::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:18px;background:var(--c);border-start-start-radius:7px;border-end-start-radius:7px}
.tag::after{content:"";position:absolute;inset-block-start:9px;inset-inline-start:5px;width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tag.l2{--c:var(--red)} .tag.l1{--c:var(--amber)} .tag.l0{--c:var(--green)}
.tag.sel{outline:2px solid var(--petrol)}
.tag.done{opacity:.6}
.tag h3{margin:0;font:600 14.5px var(--display);display:flex;gap:8px;align-items:center}
.tag h3 time{margin-inline-start:auto;font:400 11.5px var(--body);color:var(--muted)}
.lvl{font:600 11px var(--display);padding:1px 7px;border-radius:99px}
.l2 .lvl{background:var(--red-soft);color:var(--red)} .l1 .lvl{background:var(--amber-soft);color:var(--amber-ink)}

.tag pre{margin:6px 0 0;font:13px/1.55 var(--body);white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button,.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px}
.acts button.primary,.btn.primary{background:var(--petrol);color:var(--on-petrol);border-color:var(--petrol)}

.note{font-size:12px;color:var(--muted);margin-top:6px}

.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.row.sel{outline:2px solid var(--petrol)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.dot.l1{background:var(--amber)} .dot.l2{background:var(--red)}
.row .meta{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--muted)}

/* detail */
.detail{padding:16px;overflow:auto;flex:1;min-height:0}
.empty{margin:auto;color:var(--muted);text-align:center;padding:40px 20px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:14px}
.phead h1{margin:0;font:600 24px var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--petrol-soft);color:var(--petrol)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.card h4{margin:0 0 6px;font:500 13px var(--display);color:var(--muted);display:flex;justify-content:space-between}
.big{font:500 28px/1 var(--display)} .big small{font-size:13px;color:var(--muted);font-weight:400}
svg.chart{width:100%;height:auto;display:block}
.strip{display:flex;gap:5px;margin-top:8px}
.strip i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.strip i.y{background:var(--green)} .strip i.n{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:500;color:var(--muted)}
section{margin-top:14px}
section>h4{margin:0 0 8px;font:500 14px var(--display)}

/* simulator */
.sim-top{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sim-top select{flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--petrol-soft);min-height:0}
.b{max-width:86%;padding:7px 10px;border-radius:12px;white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;box-shadow:var(--shadow)}
.b.out{align-self:flex-start;background:var(--bubble-out);border-end-start-radius:3px}
.b.in{align-self:flex-end;background:var(--bubble-in);border-end-end-radius:3px}
.b.clin{align-self:center;background:var(--amber-soft);font-size:12px;border-radius:8px;max-width:95%}
.b time{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.qc{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.qc button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12.5px}
.send{display:flex;gap:6px;padding:10px}
.send input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);unicode-bidi:plaintext}
.hint{padding:0 10px 10px;font-size:11.5px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:18px;max-width:380px}
dialog input{width:100%;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
@media (prefers-reduced-motion:no-preference){.tag.fresh{animation:pulse 1.4s ease-out 1}@keyframes pulse{from{box-shadow:0 0 0 4px var(--red-soft)}to{box-shadow:var(--shadow)}}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12.5px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--amber-soft);color:var(--amber-ink)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.neutral{background:var(--petrol-soft);color:var(--muted)}
.rcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;border-inline-start:6px solid var(--green)}
.rcard.urgent{border-inline-start-color:var(--amber)} .rcard.overdue{border-inline-start-color:var(--red)}
.rcard h3{margin:0;font:600 14px var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcard .meta{font-size:12px;color:var(--muted);margin-top:4px}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv2 dt{color:var(--muted)} .kv2 dd{margin:0}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bars{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sub-h{display:flex;align-items:center;gap:10px;margin:14px 0 8px} .sub-h h4{margin:0;font:500 14px var(--display)} .sub-h .btn{margin-inline-start:auto;padding:3px 10px}
.kpis{gap:16px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><b>رفيق</b><span id="tag"></span></div>
  <div class="kpis" id="kpis"></div>
  <div class="ctl"><span class="chan" id="chan"></span><span class="who" id="who"></span>
    <button class="btn" id="enroll" type="button"></button><a class="btn hidden" id="adminlink" href="/admin"></a>
    <button class="icon-btn" id="theme" type="button"></button><button class="btn" id="lang" type="button">EN</button>
    <button class="btn" id="pw" type="button"></button><button class="btn" id="logout" type="button"></button></div>
</header>
<main>
  <section class="col" style="margin:0">
    <div class="tabs" role="tablist"><button role="tab" id="t-alerts" aria-selected="true"></button><button role="tab" id="t-refs" aria-selected="false"></button><button role="tab" id="t-pts" aria-selected="false"></button></div>
    <div class="scroll" id="left"></div>
  </section>
  <section class="col" style="margin:0"><div class="detail" id="detail"></div></section>
  <section class="col" style="margin:0">
    <h2 id="sim-h"></h2>
    <div class="sim-top"><select id="sim-pt"></select><select id="sim-dia"></select></div>
    <div class="chat" id="chat"></div>
    <div class="qc" id="qc"></div>
    <form class="send" id="send"><input id="msg" autocomplete="off" dir="auto"><button class="btn primary" id="sendbtn"></button></form>
    <div class="sim-top" style="border-top:1px solid var(--line);border-bottom:0"><button class="btn" id="startci"></button><button class="btn" id="tick"></button></div>
    <div class="hint" id="simhint"></div>
  </section>
</main>

const CHIPS_C = {ar:["سكري 118","سكري 6.5","ضغطي 150/95","ضغطي 12 على 8","لا","دوخة وصداع","وجع في صدري","ايوه","ما اخذت"],

let programme="chronic", tab="alerts", filter="open", selected=null, lastMsgId=0, cfg={dialects:{}}, patients=[], seenAlerts=new Set(), isAdmin=false;
const $ = id => document.getElementById(id), t = k => I18N[lang][k] ?? k, esc = R.esc, nf = R.nf;
const api = R.api, ago = R.ago;

const sym = c => (cfg.symptoms&&cfg.symptoms[c]?cfg.symptoms[c][lang==="ar"?1:0]:c);
const scrClass = s => ({up_to_date:"good",due_soon:"warn",due:"warn",overdue:"bad",referred:"bad",specialist_plan:"warn"}[s]||"neutral");

const rsn = codes => codes.map(c=>t("rsn")[c]||sym(c)).join(" · ");

function applyLang(){
  $("tag").textContent=(t("tags")||{})[programme]||t("tag"); $("enroll").textContent=t("enrollBtn"); $("adminlink").textContent=t("adminBtn");
  $("t-alerts").textContent=t("alerts"); $("t-refs").textContent=t("referrals"); $("t-pts").textContent=t("patients");

  $("qc").innerHTML = CHIPS[lang].map(c=>`<button type="button" data-c="${esc(c)}">${esc(c)}</button>`).join("");

async function loadOverview(){
  const o = await api("/api/overview"), s=o.screening, r=o.referrals;
  const k = (cls,v,l)=>`<div class="kpi ${cls}"><b class="num">${v}</b><small>${l}</small></div>`;
  let h = k("urgent",nf(o.open_urgent),t("k_urgent")) + k("",nf(o.open_watch),t("k_watch"));
  if(o.adherence_7d!=null) h += k("",nf(o.adherence_7d)+"%",t("k_adh"));
  if(o.adherence_7d!=null || programme==="chronic") h += k("",nf(o.checkin_rate_7d)+"%",t("k_rate")) + k("",o.median_urgent_ack_min==null?"—":nf(o.median_urgent_ack_min),t("k_ack"));
  if(s.breast_patients){
    h += k(r.overdue?"urgent":"",nf(r.overdue),t("k_over")) + k("",nf(r.open),t("k_open")) +
         k("",s.coverage_pct==null?"—":nf(s.coverage_pct)+"%",t("k_cov")) + k("",nf(s.due+s.overdue),t("k_due")) + k("",r.median_days_to_seen==null?"—":nf(r.median_days_to_seen),t("k_days"));
  }
  $("kpis").innerHTML = h;
}

async function loadLeft(){
  if(tab==="alerts"){
    const list = await api("/api/alerts?status="+(filter==="open"?"open":"all"));
    const bar = `<div style="display:flex;gap:6px"><button class="btn ${filter==="open"?"primary":""}" data-f="open">${t("open")}</button><button class="btn ${filter==="all"?"primary":""}" data-f="all">${t("all")}</button></div>`;
    const cards = list.map(a=>{
      const fresh = !seenAlerts.has(a.id) && seenAlerts.size>0 && a.level===2; seenAlerts.add(a.id);
      const body = lang==="ar"?a.summary_ar:a.summary_en, rest = body.split("\n").slice(1);
      return `<article class="tag l${a.level} ${a.status!=="open"?"done":""} ${selected===a.patient_id?"sel":""} ${fresh?"fresh":""}" data-p="${a.patient_id}">
        <h3><span>${esc(a.patient_name)}</span><span class="lvl">${lvlName(a.level)}</span><time>${ago(a.created_at)}</time></h3>
        <pre>${esc(rest.join("\n"))}</pre>
        ${a.status==="open"?`<div class="acts"><button class="primary" data-ack="${a.id}">${t("ack")}</button><button data-res="${a.id}">${t("resolve")}</button></div>`
          :`<div class="note">${t("ackedby")}: ${esc(a.ack_by||"")} ${a.note?"· "+esc(a.note):""}</div>`}
        <div class="note">${t("rules")} <bdi>${esc(a.rules_version)}</bdi></div></article>`; }).join("");
    $("left").innerHTML = bar + (cards || `<div class="empty">${t("noalerts")}</div>`);
  } else if(tab==="refs"){
    const list = await api("/api/referrals?status="+(filter==="open"?"open":filter==="overdue"?"overdue":"all"));
    const bar = ["open","overdue","all"].map(f=>`<button class="btn ${filter===f?"primary":""}" data-f="${f}">${t(f)}</button>`).join("");
    $("left").innerHTML = `<div style="display:flex;gap:6px">${bar}</div>` + (list.map(r=>`<article class="rcard ${r.overdue?"overdue":r.priority==="urgent"?"urgent":""}" data-p="${r.patient_id}" data-ref="${r.id}">
      <h3><span>${esc(r.patient_name)}</span><span class="pill ${r.priority==="urgent"?"warn":"neutral"}">${t("rpri")[r.priority]}</span><span class="pill ${r.overdue?"bad":"good"}"><i></i>${t("rst")[r.status]}${r.overdue?" · "+t("overdue"):""}</span></h3>
      <div class="meta">${esc(rsn(r.reason))}${r.prefers_female_clinician?" · "+t("fd"):""}</div>
      <div class="meta">${t("contactBy")}: ${fmtD(r.contact_by)} · ${t("visitBy")}: ${fmtD(r.visit_by)}${r.appointment_date?" · "+t("appt")+": "+fmtD(r.appointment_date):""}</div>
      <div class="acts"><button data-rc="${r.id}">${t("markContacted")}</button><button class="primary" data-ru="${r.id}">${t("update")}</button></div></article>`).join("") || `<div class="empty">${t("noref")}</div>`);
    window._refs = Object.fromEntries(list.map(r=>[r.id,r]));
  } else {
    $("left").innerHTML = patients.map(p=>`<div class="row ${selected===p.id?"sel":""}" data-p="${p.id}">
      <span class="dot l${p.open_level}"></span><div><b>${esc(p.name)}</b><div class="note">${p.conditions.map(c=>t("conds")[c]).join(" · ")}${p.age?" · "+nf(p.age):""}${p.consent?"":" · "+t("consent")}</div></div>
      <div class="meta">${p.conditions.includes("breast")?`<span class="pill ${scrClass(p.screening_status)}">${t("scr")[p.screening_status]||p.screening_status}</span>`:(p.last_glucose?nf(Math.round(p.last_glucose.value1))+" mg/dL":p.last_bp?nf(Math.round(p.last_bp.value1))+"/"+nf(Math.round(p.last_bp.value2)):"")}</div></div>`).join("");
  }
}

function breastCard(b, pid){
  const fl = Object.entries(t("flagn")).map(([k,n])=>{ const v=b.risk_flags[k]; return `<span class="chip ${v===true?"bad":""}">${n}: ${v===true?t("fyes"):v===false?t("fno"):t("funk")}</span>`; }).join("");
  return `<section class="card" style="margin-bottom:14px"><h4><span>${t("bh")}</span><span class="pill ${scrClass(b.screening_status)}"><i></i>${t("scr")[b.screening_status]||b.screening_status}</span></h4>
    <dl class="kv2"><dt>${t("age")}</dt><dd class="num">${b.age?nf(b.age):"—"}</dd><dt>${t("risk")}</dt><dd>${t("riskv")[b.risk_category]||b.risk_category}${b.prefers_female_clinician?` · <span class="chip">${t("fd")}</span>`:""}</dd>
    <dt>${t("lastm")}</dt><dd class="num">${fmtD(b.last_mammogram)}</dd><dt>${t("nextd")}</dt><dd class="num">${fmtD(b.next_screening_due)} ${b.screening_booked_at?`<span class="chip ok">${t("booked")}</span>`:""}</dd></dl>
    <div class="flags">${b.intake_done?fl:""}</div>
    <div class="bars"><button class="btn primary" id="b-log">${t("logScr")}</button><button class="btn" id="b-plan">${t("setPlan")}</button></div></section>
  <section><div class="sub-h"><h4>${t("refH")}</h4></div>${b.referrals.length?`<table><tr><th>${t("why")}</th><th></th><th>${t("visitBy")}</th><th>${t("appt")}</th><th></th></tr>${b.referrals.map(r=>`<tr><td>${esc(rsn(r.reason))}</td>
    <td><span class="pill ${r.overdue?"bad":r.status==="closed"||r.status==="seen"?"good":"warn"}">${t("rst")[r.status]}${r.overdue?" · "+t("overdue"):""}</span> <span class="note">${t("rpri")[r.priority]}</span></td><td class="num">${fmtD(r.visit_by)}</td><td class="num">${fmtD(r.appointment_date)}</td>
    <td>${["new","contacted","booked"].includes(r.status)?`<button class="btn" data-ru="${r.id}" style="padding:2px 8px">${t("update")}</button>`:esc(t("outs")[r.outcome]||"")}</td></tr>`).join("")}</table>`:`<div class="note">${t("none")}</div>`}</section>
  <section><div class="sub-h"><h4>${t("screenH")}</h4></div>${b.screenings.length?`<table><tr><th>${t("date")}</th><th>${t("kind")}</th><th>${t("birads")}</th><th>${t("result")}</th></tr>${b.screenings.map(s=>`<tr><td class="num">${fmtD(s.done_on)}</td><td>${t("kinds")[s.kind]||s.kind}</td><td class="num">${s.birads??"—"}</td><td>${t("results")[s.result||""]||""}${s.notes?`<div class="note">${esc(s.notes)}</div>`:""}</td></tr>`).join("")}</table>`:`<div class="note">${t("none")}</div>`}</section>`;
}

async function loadDetail(){
  if(!selected){ $("detail").innerHTML=`<div class="empty">${t("select")}</div>`; return; }
  const d = await api("/api/patients/"+selected), p=d.patient;
  const ts = r=>new Date(r.taken_at+"Z").getTime();
  const gl = d.readings.filter(r=>r.kind==="glucose").map(r=>({t:ts(r),v:Math.round(r.value1),l:r.level}));
  const sys = d.readings.filter(r=>r.kind==="bp").map(r=>({t:ts(r),v:Math.round(r.value1),l:r.level}));
  const dia = d.readings.filter(r=>r.kind==="bp").map(r=>({t:ts(r),v:Math.round(r.value2),l:r.level}));
  const lastG=gl.at(-1), lastB=d.readings.filter(r=>r.kind==="bp").at(-1);
  const strip = d.checkins.filter(c=>c.kind!=="breast").slice(0,14).reverse().map(c=>`<i class="${c.meds_taken===1?"y":c.meds_taken===0?"n":""}" title="${c.local_date}"></i>`).join("");
  const lc = o=>({band:o.band,yMin:o.yMin,yMax:o.yMax,targetLabel:t("target"),noData:t("none")});
  const bchecks = d.checkins.filter(c=>c.kind==="breast").slice(0,6);
  $("detail").innerHTML = `
   <div class="phead"><h1>${esc(p.name)}</h1><div class="chips">${p.conditions.map(c=>`<span class="chip">${t("conds")[c]||c}</span>`).join("")}
     <span class="chip">${esc(cfg.dialects[p.dialect]||p.dialect)}</span><span class="chip">${esc(p.country)}</span>${p.consent?"":`<span class="chip warn">${t("consent")}</span>`}</div></div>
   ${d.breast?breastCard(d.breast,p.id):""}
   <div class="grid2">
    ${p.conditions.includes("diabetes")?`<div class="card"><h4><span>${t("glucose")}</span><span class="big num" style="font-size:20px">${lastG?lastG.v:"—"}</span></h4>${R.lineChart([{pts:gl,color:"var(--petrol)"}],lc({band:[70,130],yMin:40,yMax:Math.max(250,...gl.map(x=>x.v+10))}))}</div>`:""}
    ${p.conditions.includes("hypertension")?`<div class="card"><h4><span>${t("bp")}</span><span class="big num" style="font-size:20px">${lastB?Math.round(lastB.value1)+"/"+Math.round(lastB.value2):"—"}</span></h4>${R.lineChart([{pts:sys,color:"var(--petrol)"},{pts:dia,color:"var(--muted)",dash:"4 3"}],lc({band:[90,139],yMin:50,yMax:Math.max(190,...sys.map(x=>x.v+10))}))}</div>`:""}
    ${d.medications.length?`<div class="card"><h4><span>${t("adherence")}</span><span class="big num" style="font-size:20px">${d.adherence_pct==null?"—":nf(d.adherence_pct)+"%"}</span></h4><div class="strip">${strip}</div>
      <div class="note">${d.medications.map(m=>"<bdi>"+esc(m.name)+" "+esc(m.dose||"")+"</bdi> · "+m.times.join(", ")).join("<br>")}</div></div>`:""}
   </div>
   ${d.checkins.some(c=>c.kind!=="breast")?`<section><div class="sub-h"><h4>${t("ckH")}</h4></div><table><tr><th>${t("date")}</th><th>${t("symp")}</th><th>${t("meds")}</th><th>${t("lvl")}</th></tr>${d.checkins.filter(c=>c.kind!=="breast").slice(0,7).map(c=>`<tr><td class="num">${c.local_date}</td><td>${esc(c.symptoms.map(sym).join(", ")||t("none"))}${c.free_text?`<div class="note">“${esc(c.free_text)}”</div>`:""}</td><td>${c.meds_taken==null?t("none"):c.meds_taken?t("yes"):t("no")}</td><td><span class="dot l${c.level}" style="display:inline-block"></span></td></tr>`).join("")}</table></section>`:""}
   ${bchecks.length?`<section><div class="sub-h"><h4>${t("checkH")}</h4></div><table><tr><th>${t("date")}</th><th>${t("selfc")}</th><th>${t("symp")}</th></tr>${bchecks.map(c=>`<tr><td class="num">${c.local_date}</td><td>${c.self_checked==null?"—":c.self_checked?t("yes").replace("أخذ","نعم").replace("Taken","Yes"):t("no").replace("لم يأخذ","لا").replace("Missed","No")}</td>
     <td>${esc(c.symptoms.map(sym).join(", ")||t("none"))}${c.free_text?`<div class="note">“${esc(c.free_text)}”</div>`:""}</td></tr>`).join("")}</table></section>`:""}`;
  if(d.breast){ $("b-log").onclick=()=>screeningDialog(p.id); $("b-plan").onclick=()=>planDialog(p.id, d.breast.next_screening_due); }
}

function dlg(html){ const d=document.createElement("dialog"); d.innerHTML=html; document.body.appendChild(d); d.showModal(); d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{d.close();d.remove()}); return d; }
function screeningDialog(pid){
  const d = dlg(`<form id="sf"><h3>${t("logScr")}</h3>
    <label class="field"><span>${t("kind")}</span><select id="s-k">${Object.entries(t("kinds")).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
    <div class="row2"><label class="field"><span>${t("done")}</span><input id="s-d" type="date" max="${today()}" value="${today()}" required></label>
    <label class="field"><span>${t("birads")}</span><select id="s-b"><option value="">—</option>${[0,1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select></label></div>
    <label class="field"><span>${t("result")}</span><select id="s-r">${Object.entries(t("results")).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
    <label class="field"><span>${t("notes")}</span><input id="s-n" maxlength="500" dir="auto"></label><div class="err" id="s-e"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-x>${t("cancel")}</button><button class="btn primary">${t("save")}</button></div></form>`);
  d.querySelector("#sf").onsubmit = async e=>{ e.preventDefault();
    try{ const out = await R.post(`/api/patients/${pid}/screenings`,{kind:d.querySelector("#s-k").value,done_on:d.querySelector("#s-d").value,birads:d.querySelector("#s-b").value===""?null:+d.querySelector("#s-b").value,result:d.querySelector("#s-r").value||null,notes:d.querySelector("#s-n").value||null});
      d.close(); d.remove(); R.toast(t("saved")); await refreshAll(); }catch(err){ d.querySelector("#s-e").textContent=err.message; } };
}
function planDialog(pid, cur){
  const d = dlg(`<form id="pf"><h3>${t("setPlan")}</h3><label class="field"><span>${t("plan")}</span><input id="p-d" type="date" value="${cur||""}"></label><div class="err" id="p-e"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-x>${t("cancel")}</button><button class="btn primary">${t("save")}</button></div></form>`);
  d.querySelector("#pf").onsubmit = async e=>{ e.preventDefault(); try{ await R.patch("/api/patients/"+pid,{next_screening_due:d.querySelector("#p-d").value}); d.close(); d.remove(); R.toast(t("saved")); await refreshAll(); }catch(err){ d.querySelector("#p-e").textContent=err.message; } };
}
async function referralDialog(rid){
  let r = (window._refs||{})[rid]; if(!r){ const d0=await api("/api/referrals?status=all"); r=d0.find(x=>x.id===rid); }
  const d = dlg(`<form id="rf"><h3>${esc(r.patient_name)} · ${t("refH")}</h3><div class="note">${esc(rsn(r.reason))}</div>
    <label class="field"><span>${t("rst").new?"":""}Status</span><select id="r-s">${["new","contacted","booked","seen","closed"].map(s=>`<option value="${s}" ${s===r.status?"selected":""}>${t("rst")[s]}</option>`).join("")}</select></label>
    <div class="row2"><label class="field"><span>${t("appt")}</span><input id="r-a" type="date" value="${r.appointment_date||""}"></label>
    <label class="field"><span>${t("outcome")}</span><select id="r-o"><option value="">—</option>${Object.entries(t("outs")).map(([k,v])=>`<option value="${k}" ${k===r.outcome?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <label class="field"><span>${t("notes")}</span><input id="r-n" maxlength="1000" dir="auto" value="${esc(r.notes||"")}"></label><div class="err" id="r-e"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-x>${t("cancel")}</button><button class="btn primary">${t("save")}</button></div></form>`);
  d.querySelector("#rf").onsubmit = async e=>{ e.preventDefault();
    const body={status:d.querySelector("#r-s").value}; const a=d.querySelector("#r-a").value, o=d.querySelector("#r-o").value, n=d.querySelector("#r-n").value;
    if(a) body.appointment_date=a; if(o) body.outcome=o; if(n) body.notes=n;
    try{ await R.patch("/api/referrals/"+rid, body); d.close(); d.remove(); R.toast(t("saved")); await refreshAll(); }catch(err){ d.querySelector("#r-e").textContent=err.message; } };
}

/* simulator */
function bubble(m){ const cls = m.direction==="in"?"in":m.direction==="out"?"out":"clin";
  const time=new Date(m.created_at+"Z").toLocaleTimeString(lang==="ar"?"ar-EG":"en",{hour:"2-digit",minute:"2-digit"});
  return `<div class="b ${cls}">${esc(m.body)}<time>${time}</time></div>`; }
async function loadChat(reset){
  if(!selected){ $("chat").innerHTML=""; return; }
  if(reset){ lastMsgId=0; $("chat").innerHTML=""; }
  const ms = await api(`/api/patients/${selected}/messages?after=${lastMsgId}`);
  if(!ms.length) return;
  $("chat").insertAdjacentHTML("beforeend", ms.map(bubble).join("")); lastMsgId = ms.at(-1).id; $("chat").scrollTop = $("chat").scrollHeight;
}
function fillSim(){
  $("sim-pt").innerHTML = patients.map(p=>`<option value="${p.id}" ${p.id===selected?"selected":""}>${esc(p.name)}</option>`).join("");
  $("sim-dia").innerHTML = Object.entries(cfg.dialects).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  const p = patients.find(x=>x.id===selected); if(p) $("sim-dia").value = p.dialect;
}
async function select(id){ selected=id; fillSim(); await Promise.all([loadDetail(), loadLeft(), loadChat(true)]); }
async function refreshAll(){ patients = await api("/api/patients"); await Promise.all([loadOverview(), loadLeft(), selected?loadDetail():0]); fillSim(); }

document.addEventListener("click", async e=>{
  const b = e.target.closest("button,[data-p]"); if(!b) return;
  try{
    if(b.dataset.ack){ e.stopPropagation(); await api(`/api/alerts/${b.dataset.ack}/ack`,{method:"POST",body:JSON.stringify({note:""})}); return refreshAll(); }
    if(b.dataset.res){ e.stopPropagation(); await api(`/api/alerts/${b.dataset.res}/resolve`,{method:"POST",body:JSON.stringify({note:""})}); return refreshAll(); }
    if(b.dataset.rc){ e.stopPropagation(); await R.patch("/api/referrals/"+b.dataset.rc,{status:"contacted"}); R.toast(t("saved")); return refreshAll(); }
    if(b.dataset.ru){ e.stopPropagation(); return referralDialog(+b.dataset.ru); }
    if(b.dataset.f){ filter=b.dataset.f; return loadLeft(); }
    if(b.dataset.c){ $("msg").value=b.dataset.c; return $("send").requestSubmit(); }
    if(b.dataset.p) return select(+b.dataset.p);
  }catch(err){ R.toast(err.message); }
});
const setTab = k=>{ tab=k; filter = k==="alerts"||k==="refs" ? "open" : filter; for(const [id,key] of [["t-alerts","alerts"],["t-refs","refs"],["t-pts","pts"]]) $(id).setAttribute("aria-selected", key===k); loadLeft(); };
$("t-alerts").onclick=()=>setTab("alerts"); $("t-refs").onclick=()=>setTab("refs"); $("t-pts").onclick=()=>setTab("pts");
$("sim-pt").onchange=e=>select(+e.target.value);
$("sim-dia").onchange=async e=>{ if(!selected) return; await api("/api/patients/"+selected,{method:"PATCH",body:JSON.stringify({dialect:e.target.value})}); await refreshAll(); };
$("send").onsubmit=async e=>{ e.preventDefault(); const v=$("msg").value.trim(); if(!v||!selected) return; $("msg").value="";
  await api("/api/sim/send",{method:"POST",body:JSON.stringify({patient_id:selected,text:v})}); await loadChat(); await refreshAll(); };
$("startci").onclick=async()=>{ if(!selected) return; await api(`/api/patients/${selected}/start-checkin?simulate=true`,{method:"POST"}); loadChat(); };
$("tick").onclick=async()=>{ await api("/api/sim/tick",{method:"POST",body:"{}"}); loadChat(); refreshAll(); };

(async function init(){
  const onLang=()=>{lang=R.lang; applyLang(); refreshAll(); loadChat(true);};
  applyLang(); R.chrome({onLang});
  cfg = await api("/api/config"); $("chan").textContent = cfg.channel==="whatsapp"?"WhatsApp live":"simulator";
  isAdmin = cfg.user.role==="admin"; programme = cfg.programme || "chronic"; CHIPS = programme==="breast" ? CHIPS_B : CHIPS_C;
  if(programme==="chronic") $("t-refs").classList.add("hidden");
  applyLang();
  R.chrome({who: cfg.user.name, onLang});
  if(isAdmin) $("adminlink").classList.remove("hidden"); else $("tick").classList.add("hidden");
  $("enroll").onclick = async ()=>{ const cl = isAdmin ? await api("/api/admin/clinicians") : [];
    R.enrollDialog({clinicians:cl, dialects:cfg.dialects, countries:cfg.countries, isAdmin, programme, onDone:refreshAll}); };
  await refreshAll();
  const first = patients.find(p=>p.open_level===2) || patients[0]; if(first) await select(first.id);
  setInterval(()=>{ if(!document.hidden) loadChat(); }, 2500);
  setInterval(()=>{ if(!document.hidden) refreshAll(); }, 15000);
})();
</script>
