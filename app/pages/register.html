<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق · Rafiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
body{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);min-height:100%}
.hero{background:var(--topbar);color:var(--on-topbar);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero .mark{font:600 clamp(56px,9vw,104px)/1 var(--display)}
.hero p{max-width:32ch;font-size:16px;opacity:.9;margin:0}
.hero ul{margin:0;padding-inline-start:18px;opacity:.9;max-width:34ch}
.tags{display:flex;gap:10px}
.tags i{width:40px;height:56px;border-radius:6px;background:var(--c);position:relative;display:block}
.tags i::after{content:"";position:absolute;inset-block-start:7px;inset-inline-start:50%;margin-inline-start:-4px;width:8px;height:8px;border-radius:50%;background:var(--topbar)}
.formside{display:flex;flex-direction:column;padding:20px clamp(18px,5vw,56px) 40px}
.tools{display:flex;gap:8px;justify-content:flex-end}
.formwrap{width:100%;max-width:560px;align-self:center;margin-top:10px}
h1{font:600 26px var(--display);margin:0 0 4px} .sub{color:var(--muted);margin:0 0 16px}
.notice{border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;background:var(--surface)}
.consent{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 12px;font-size:13px;background:var(--surface)}
.consent ul{margin:6px 0 8px;padding-inline-start:18px}
.consent label{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.consent input{margin-top:4px}
.codebox{font:600 28px/1 var(--display);letter-spacing:.4em;text-align:center;direction:ltr}
.pwrow{position:relative} .pwrow button{position:absolute;inset-block:0;inset-inline-end:4px;border:0;background:none;color:var(--muted);padding:0 8px}
@media (max-width:860px){body{grid-template-columns:1fr}.hero{padding:22px 22px}.hero p,.hero ul,.tags{display:none}.hero .mark{font-size:56px}}
</style>
</head>
<body>
<section class="hero" aria-hidden="true">
  <div class="mark">رفيق</div>
  <p id="h-tag"></p>
  <ul id="h-list"></ul>
  <div class="tags"><i style="--c:var(--red)"></i><i style="--c:var(--amber)"></i><i style="--c:var(--green)"></i></div>
</section>
<main class="formside">
  <div class="tools"><button class="icon-btn" id="theme" type="button"></button><button class="btn" id="lang" type="button"></button></div>
  <div class="formwrap">
    <!-- step 1: account -->
    <section id="s1">
      <h1 id="h"></h1><p class="sub" id="sub"></p>
      <div class="notice" id="notice"></div>
      <form id="f" autocomplete="on" novalidate>
        <label class="field"><span id="l-name"></span><input id="name" required dir="auto" maxlength="80" autocomplete="name"></label>
        <div class="row2">
          <label class="field"><span id="l-phone"></span><input id="phone" required dir="ltr" inputmode="tel" placeholder="962790000000" autocomplete="tel"></label>
          <label class="field"><span id="l-by"></span><input id="by" type="number" required min="1900" max="2010" dir="ltr" placeholder="1980"></label>
        </div>
        <label class="field"><span id="l-email"></span><input id="email" type="email" dir="ltr" autocomplete="email"></label>
        <label class="field"><span id="l-pw"></span><div class="pwrow"><input id="regpw" type="password" required minlength="8" dir="ltr" autocomplete="new-password"><button type="button" id="show"></button></div><small class="note" id="pw-hint"></small></label>
        <div class="row2">
          <label class="field"><span id="l-country"></span><select id="country"></select></label>
          <label class="field"><span id="l-dialect"></span><select id="dialect"></select></label>
        </div>
        <div class="row2">
          <label class="field"><span id="l-gender"></span><select id="gender"></select></label>
          <label class="field"><span id="l-invite"></span><input id="invite" dir="ltr" maxlength="32" autocapitalize="characters" style="text-transform:uppercase"></label>
        </div>
        <div class="checks"><label><input type="checkbox" id="fd"> <span id="l-fd"></span></label></div>
        <div class="consent" id="consent"></div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary" id="go" style="width:100%;padding:11px"></button>
        <p class="note" style="text-align:center;margin-top:12px" id="have"></p>
      </form>
    </section>
    <!-- step 2: verification -->
    <section id="s2" class="hidden">
      <h1 id="v-h"></h1><p class="sub" id="v-sub"></p>
      <form id="vf">
        <label class="field"><span id="l-code"></span><input id="code" class="codebox" inputmode="numeric" maxlength="6" pattern="\d{6}" autocomplete="one-time-code" required></label>
        <div class="err" id="v-err" role="alert"></div>
        <button class="btn primary" id="v-go" style="width:100%;padding:11px"></button>
        <p class="note" style="text-align:center;margin-top:12px"><button type="button" class="btn" id="resend"></button></p>
      </form>
    </section>
  </div>
</main>
<script>
const R = window.RAFIQ, $ = (i) => document.getElementById(i);
const L = {
  ar: { htag: "الكشف المبكر ينقذ الأرواح. رفيق يساعدك على الفحص الدوري ومتابعة أي تغيير حتى تُفحصي.", hl: ["تذكير بموعد الماموغرام", "متابعة شهرية للوعي بالثدي", "تتبّع أي إحالة حتى زيارة العيادة", "بياناتك سرية ويمكنك حذفها متى شئتِ"],
    h: "إنشاء حساب", sub: "يستغرق دقيقتين. للبالغين 18 عامًا فأكثر.", notice: "<b>رفيق ليس تشخيصًا ولا بديلًا عن الطبيب.</b> إن لاحظتِ كتلة أو أي تغيّر في الثدي فلا تنتظري؛ راجعي العيادة مباشرة.",
    name: "الاسم الكامل", phone: "رقم الهاتف (مع رمز الدولة، ويفضل أن يكون واتساب)", by: "سنة الميلاد", email: "البريد الإلكتروني", emailOpt: " (اختياري)", pw: "كلمة المرور", pwHint: "٨ أحرف على الأقل، وليست كلمة شائعة مثل password أو 12345678.", errName: "اكتبي اسمك.", errPhone: "اكتبي رقم الهاتف مع رمز الدولة (7 أرقام على الأقل).", errBy: "اكتبي سنة ميلاد صحيحة (يجب أن تكوني 18 عامًا فأكثر).", errPw: "كلمة المرور قصيرة: يجب أن تكون 8 أحرف على الأقل.", country: "الدولة", dialect: "لغة الرسائل / اللهجة",
    gender: "الجنس", female: "أنثى", male: "ذكر", invite: "رمز العيادة (إن وُجد)", inviteReq: "رمز العيادة (مطلوب)", fd: "أفضّل أن يفحصني طبيب/ة من النساء", show: "إظهار", hide: "إخفاء",
    cTitle: "الموافقة والخصوصية", cList: ["نجمع: بيانات الحساب، سنة الميلاد، تاريخ الفحوصات، إجاباتك عن أسئلة الصحة، ورسائلك مع رفيق.", "يراها فريقك الصحي في العيادة فقط، ولا نبيعها ولا نشاركها للإعلانات.", "ترسل لك الرسائل على واتساب أو الموقع؛ ويمكنك إيقافها بكتابة «إيقاف».", "يمكنك تنزيل بياناتك أو حذف حسابك نهائيًا في أي وقت من صفحتك."],
    cAgree: "أوافق على معالجة بياناتي الصحية كما هو موضّح أعلاه وعلى استلام الرسائل.", create: "إنشاء الحساب", have: "لديك حساب؟", signin: "تسجيل الدخول",
    vh: "تأكيد حسابك", vsubW: "أرسلنا رمزًا من 6 أرقام إلى واتساب على الرقم", vsubE: "أرسلنا رمزًا من 6 أرقام إلى بريدك", vsubN: "أدخلي الرمز المكوّن من 6 أرقام.", code: "رمز التحقق", vgo: "تأكيد", resend: "إعادة إرسال الرمز", sent: "تم إرسال رمز جديد",
    agreeErr: "يجب الموافقة على الشروط للمتابعة.", fail: "تعذّر إنشاء الحساب", notsent: "تعذّر إرسال الرمز؛ اضغط «إعادة إرسال الرمز»." },
  en: { htag: "Early detection saves lives. Rafiq helps you keep up with screening and follow any change until you are seen.", hl: ["Mammogram reminders", "Monthly breast-awareness check-in", "Referral tracking until you reach the clinic", "Your data stays private, and you can delete it any time"],
    h: "Create your account", sub: "Takes two minutes. For adults aged 18 and over.", notice: "<b>Rafiq is not a diagnosis and not a substitute for a doctor.</b> If you notice a lump or any change in your breast, don't wait; contact your clinic directly.",
    name: "Full name", phone: "Phone number (with country code; WhatsApp preferred)", by: "Birth year", email: "Email", emailOpt: " (optional)", pw: "Password", pwHint: "At least 8 characters, and not a common password like “password” or 12345678.", errName: "Please enter your name.", errPhone: "Enter your phone number with country code (at least 7 digits).", errBy: "Enter a valid birth year (you must be 18 or over).", errPw: "That password is too short: use at least 8 characters.", country: "Country", dialect: "Message language / dialect",
    gender: "Gender", female: "Female", male: "Male", invite: "Clinic code (if you have one)", inviteReq: "Clinic code (required)", fd: "I prefer to be seen by a female clinician", show: "Show", hide: "Hide",
    cTitle: "Consent and privacy", cList: ["We collect: account details, birth year, screening dates, your answers to health questions, and your chats with Rafiq.", "Only your care team at the clinic sees it. We never sell it or share it for advertising.", "Messages arrive on WhatsApp or the website; type “stop” to stop them.", "You can download your data or permanently delete your account any time from your page."],
    cAgree: "I agree to my health information being processed as described above, and to receive messages.", create: "Create account", have: "Already have an account?", signin: "Sign in",
    vh: "Confirm your account", vsubW: "We sent a 6-digit code on WhatsApp to", vsubE: "We sent a 6-digit code to your email", vsubN: "Enter the 6-digit code.", code: "Verification code", vgo: "Confirm", resend: "Resend code", sent: "A new code was sent",
    agreeErr: "You need to agree to the terms to continue.", fail: "Could not create the account", notsent: "We couldn't send the code; press “Resend code”." },
};
const t = (k) => L[R.lang][k];
let cfg = { verification: "none", invite_required: false, dialects: {}, countries: [] }, pending = null;

function paint() {
  $("h-tag").textContent = t("htag"); $("h-list").innerHTML = t("hl").map((x) => `<li>${R.esc(x)}</li>`).join("");
  $("h").textContent = t("h"); $("sub").textContent = t("sub"); $("notice").innerHTML = t("notice");
  $("l-name").textContent = t("name"); $("l-phone").textContent = t("phone"); $("l-by").textContent = t("by");
  $("l-email").textContent = t("email") + (cfg.verification === "email" ? "" : t("emailOpt")); $("l-pw").textContent = t("pw"); $("pw-hint").textContent = t("pwHint");
  $("l-country").textContent = t("country"); $("l-dialect").textContent = t("dialect"); $("l-gender").textContent = t("gender");
  $("l-invite").textContent = cfg.invite_required ? t("inviteReq") : t("invite"); $("l-fd").textContent = t("fd");
  const keep = { c: $("country").value, d: $("dialect").value, g: $("gender").value };
  $("country").innerHTML = cfg.countries.map((c) => `<option>${c}</option>`).join(""); if (keep.c) $("country").value = keep.c;
  $("dialect").innerHTML = Object.entries(cfg.dialects).map(([k, v]) => `<option value="${k}">${R.esc(v)}</option>`).join(""); $("dialect").value = keep.d || (R.lang === "en" ? "en" : "levantine");
  $("gender").innerHTML = `<option value="f">${t("female")}</option><option value="m">${t("male")}</option>`; if (keep.g) $("gender").value = keep.g;
  $("show").textContent = $("regpw").type === "password" ? t("show") : t("hide");
  $("consent").innerHTML = `<b>${t("cTitle")}</b><ul>${t("cList").map((x) => `<li>${R.esc(x)}</li>`).join("")}</ul><label><input type="checkbox" id="agree"> <span>${t("cAgree")}</span></label>`;
  $("go").textContent = t("create"); $("have").innerHTML = `${t("have")} <a href="/login">${t("signin")}</a>`;
  $("v-h").textContent = t("vh"); $("l-code").textContent = t("code"); $("v-go").textContent = t("vgo"); $("resend").textContent = t("resend");
  if (pending) vsub();
}
function vsub() {
  $("v-sub").textContent = pending.verification === "whatsapp" ? `${t("vsubW")} ${pending.phone || ""}` : pending.verification === "email" ? t("vsubE") : t("vsubN");
}
R.chrome({ onLang: paint });
$("show").onclick = () => { $("regpw").type = $("regpw").type === "password" ? "text" : "password"; paint2(); };
function paint2() { $("show").textContent = $("regpw").type === "password" ? t("show") : t("hide"); }

$("f").onsubmit = async (e) => {
  e.preventDefault(); $("err").textContent = "";
  const yr = new Date().getFullYear(), by = +$("by").value;
  if (!$("name").value.trim()) { $("err").textContent = t("errName"); $("name").focus(); return; }
  if (($("phone").value.match(/\d/g) || []).length < 7) { $("err").textContent = t("errPhone"); $("phone").focus(); return; }
  if (!by || by < 1900 || yr - by < 18) { $("err").textContent = t("errBy"); $("by").focus(); return; }
  if ($("regpw").value.length < 8) { $("err").textContent = t("errPw"); $("regpw").focus(); return; }
  if (!$("agree").checked) { $("err").textContent = t("agreeErr"); return; }
  $("go").disabled = true;
  try {
    const r = await fetch("/api/auth/register", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      name: $("name").value.trim(), phone: $("phone").value, email: $("email").value.trim() || null, password: $("regpw").value, birth_year: +$("by").value, gender: $("gender").value,
      dialect: $("dialect").value, country: $("country").value, invite_code: $("invite").value.trim() || null, prefers_female_clinician: $("fd").checked, consent: true }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const d = Array.isArray(j.detail) ? j.detail.map((x) => x.msg).join("; ") : j.detail; throw new Error(d || t("fail")); }
    if (j.status === "ok") { location.href = j.redirect; return; }
    pending = { username: j.username, verification: j.verification, phone: $("phone").value };
    showVerify(j.sent === false);
  } catch (err) { $("err").textContent = err.message; }
  finally { $("go").disabled = false; }
};
function showVerify(notSent) {
  $("s1").classList.add("hidden"); $("s2").classList.remove("hidden"); vsub(); $("code").focus();
  if (notSent) $("v-err").textContent = t("notsent");
}
$("vf").onsubmit = async (e) => {
  e.preventDefault(); $("v-err").textContent = "";
  try {
    const r = await fetch("/api/auth/verify", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: pending.username, code: $("code").value.trim() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Error");
    location.href = j.redirect;
  } catch (err) { $("v-err").textContent = err.message; $("code").value = ""; $("code").focus(); }
};
$("resend").onclick = async () => {
  $("v-err").textContent = "";
  const r = await fetch("/api/auth/resend", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: pending.username }) });
  const j = await r.json().catch(() => ({}));
  $("v-err").textContent = r.ok ? t("sent") : (j.detail || "Error");
};
(async function init() {
  cfg = await (await fetch("/api/auth/signup-config")).json();
  if (!cfg.enabled) { document.querySelector(".formwrap").innerHTML = `<h1>${t("h")}</h1><p class="sub">Self-registration is turned off. Please contact your clinic.</p><a href="/login">${t("signin")}</a>`; return; }
  paint();
  try { const pub = await (await fetch("/api/auth/public")).json(); if (pub.demo) $("invite").placeholder = pub.invite_code; } catch (e) { /* ignore */ }
  const v = new URLSearchParams(location.search).get("verify");
  if (v) { pending = { username: v, verification: cfg.verification }; showVerify(false); }
})();
</script>
</body>
</html>
