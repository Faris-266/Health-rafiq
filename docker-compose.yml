services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rafiq
      POSTGRES_PASSWORD: change-this-db-password      # must match DATABASE_URL in .env
      POSTGRES_DB: rafiq
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafiq"]
      interval: 5s
      retries: 10
  rafiq:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    env_file: .env
volumes:
  pgdata:
